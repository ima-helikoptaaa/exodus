# ─────────────────────────────────────────────────────────────────────────────
# Job boards to search AFTER company career pages
# ─────────────────────────────────────────────────────────────────────────────
job_boards:
  - name: Wellfound (AngelList)
    search_url: https://wellfound.com/jobs
    queries:
      - "site:wellfound.com software engineer India"
      - "site:wellfound.com backend engineer India"
      - "site:wellfound.com ML engineer India remote"

  - name: Hacker News Who's Hiring
    queries:
      - "site:news.ycombinator.com who is hiring CURRENTMONTH CURRENTYEAR India remote"

  - name: levels.fyi
    search_url: https://www.levels.fyi/jobs
    queries:
      - "site:levels.fyi software engineer India"

  - name: Instahyre
    search_url: https://www.instahyre.com
    queries:
      - "site:instahyre.com software engineer"
      - "site:instahyre.com backend engineer"

  - name: Naukri
    search_url: https://www.naukri.com
    queries:
      - "site:naukri.com software engineer 0-3 years bangalore"
      - "site:naukri.com backend engineer 0-3 years"

  - name: LinkedIn India
    queries:
      - "site:linkedin.com/jobs software engineer India 2024 2025"
      - "site:linkedin.com/jobs backend engineer Bangalore"

  - name: RemoteOK
    search_url: https://remoteok.com
    queries:
      - "site:remoteok.com backend engineer India"
      - "site:remoteok.com software engineer India"

  - name: Cutshort
    search_url: https://cutshort.io
    queries:
      - "site:cutshort.io software engineer"
      - "site:cutshort.io backend engineer"

# ─────────────────────────────────────────────────────────────────────────────
# Aggregator sources — driven by the connector registry (scout.service reads
# these). Each `type` maps to a connector; `enabled: false` turns one off.
# Credential-backed sources (serpapi/linkedin/reddit/wellfound/naukri) no-op
# gracefully if their env vars are missing, so it's safe to leave them enabled.
# ─────────────────────────────────────────────────────────────────────────────
sources:
  # --- Free, no auth ---
  - type: hn_hiring
    name: HN Who is Hiring
    enabled: true
    options:
      indiaOrRemoteOnly: true

  - type: remoteok
    name: RemoteOK
    enabled: true

  - type: remotive
    name: Remotive
    enabled: true
    options:
      searches:
        - software engineer
        - backend engineer
        - full stack engineer
        - platform engineer
        - devops

  - type: weworkremotely
    name: We Work Remotely
    enabled: true
    options:
      feeds:
        - https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
        - https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss
        - https://weworkremotely.com/remote-jobs.rss

  # --- Free but needs an Algolia public key from YC's bundle ---
  - type: workatastartup
    name: YC Work at a Startup
    enabled: false   # set WAAS_ALGOLIA_APP_ID / WAAS_ALGOLIA_API_KEY, then enable
    options:
      query: engineer

  # --- Free with app creds (falls back to public JSON if unset) ---
  - type: reddit_hiring
    name: r/developersIndia hiring
    enabled: true
    options:
      subreddits:
        - developersIndia
        - cscareerquestionsIndia

  # --- Paid API key (SERPAPI_KEY) — long-tail coverage of slug-less companies ---
  - type: serpapi
    name: SerpApi long-tail
    enabled: true
    options:
      location: India
      queries:
        - 'site:razorpay.com/jobs software engineer'
        - 'site:careers.cred.club software engineer'
        - 'site:flipkartcareers.com software engineer'
        - 'site:careers.swiggy.com software engineer'
        - 'site:juspay.in/careers software engineer'
        - 'site:groww.in/careers software engineer'
        - 'site:zerodha.com/careers engineer'
        - 'site:phonepe.com/careers software engineer'
        - 'site:tower-research.com engineer india'
        - 'site:deshaw.com/careers engineer india'

  # --- Free long-tail via self-hosted SearXNG (replaces SerpApi when up).
  #     Reads SEARXNG_URL env (default http://localhost:8888). Needs JSON
  #     format enabled in SearXNG settings. Enable once the instance is live. ---
  - type: searxng
    name: SearXNG long-tail
    enabled: false
    options:
      location: India
      queries:
        - 'site:razorpay.com software engineer'
        - 'site:careers.cred.club software engineer'
        - 'site:flipkartcareers.com software engineer'
        - 'site:careers.swiggy.com software engineer'
        - 'site:juspay.in software engineer'
        - 'site:groww.in software engineer'
        - 'site:zerodha.com engineer'
        - 'site:phonepe.com software engineer'
        - 'software engineer job india backend 0-3 years'
        - 'startup hiring backend engineer india remote'

  # --- Playwright scrapers (heavy). LinkedIn works unauthenticated via the
  #     guest endpoint; set LINKEDIN_LI_AT for authenticated results. ---
  - type: linkedin
    name: LinkedIn Jobs
    enabled: true
    options:
      # Guest endpoint returns ~10 jobs/page; pages*10 is the ceiling per query.
      pages: 8
      queries:
        - keywords: backend engineer
          location: India
          freshnessSeconds: 604800
        - keywords: software engineer
          location: India
          freshnessSeconds: 604800
        - keywords: software engineer
          location: India
          freshnessSeconds: 604800
          remote: true
        - keywords: full stack engineer
          location: India
          freshnessSeconds: 604800
        - keywords: platform engineer
          location: India
          freshnessSeconds: 604800
        - keywords: backend engineer
          location: India
          freshnessSeconds: 604800
          remote: true

  - type: wellfound
    name: Wellfound
    enabled: false   # needs WELLFOUND_COOKIE for reliable results
    options:
      roles:
        - software-engineer
        - backend-engineer
      location: india

  - type: naukri
    name: Naukri
    enabled: false   # set NAUKRI_RSS_FEEDS (saved-search RSS) then enable
    options: {}
