# =============================================================================
# Exodus Job Scout — Target Companies & Job Boards
# The scout checks these in order: Greenhouse API first (fast, structured),
# then career page URLs via WebFetch, then broad job board searches.
# =============================================================================

# Title keyword filters — applied BEFORE evaluation to skip obviously wrong roles
title_filters:
  # At least one positive keyword must appear in the job title
  positive:
    - Software Engineer
    - Backend Engineer
    - Platform Engineer
    - Product Engineer
    - ML Engineer
    - Machine Learning Engineer
    - AI Engineer
    - Data Engineer
    - Infrastructure Engineer
    - Full Stack Engineer
    - Fullstack Engineer
    - Full-Stack Engineer
    - Founding Engineer
    - Site Reliability Engineer
    - SRE
    - DevOps Engineer
    - Cloud Engineer
    - Systems Engineer
  # Instant reject if any negative keyword appears
  negative:
    - Staff
    - Principal
    - Director
    - VP
    - Head of
    - Manager
    - Lead
    - Architect  # usually 8+ years
    - Distinguished
    - Fellow
    - Intern
    - Trainee
    - Frontend
    - Front-End
    - Front End
    - Mobile
    - iOS
    - Android
    - QA
    - SDET
    - Test Engineer
    - DevRel
    - Developer Advocate
    - Technical Writer
    - Solutions Engineer
    - Sales Engineer
    - Support Engineer
    - Customer Success

